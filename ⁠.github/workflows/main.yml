jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -project OfflineMusic.xcodeproj \
            -scheme OfflineMusic \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OfflineMusic.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        run: |
          cd $RUNNER_TEMP
          mkdir Payload
          cp -r OfflineMusic.xcarchive/Products/Applications/OfflineMusic.app Payload/
          zip -r OfflineMusic.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMusic-Unsigned-IPA
          path: ${{ runner.temp }}/OfflineMusic.ipa
