name: Build Toyako IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag for the IPA"
        required: true
        default: "toyako-ipa"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1)"

          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 was not found."
            xcodebuild -version
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project Toyako.xcodeproj \
            -scheme Toyako \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Toyako.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/Toyako.xcarchive/Products/Applications/Toyako.app"
          IPA="$RUNNER_TEMP/Toyako.ipa"

          test -d "$APP"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP" "$RUNNER_TEMP/Payload/Toyako.app"

          # An IPA is itself a ZIP-format package with a .ipa extension.
          # This creates ONLY Toyako.ipa; there is no outer .zip file.
          (
            cd "$RUNNER_TEMP"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
              Payload \
              "$IPA"
          )

          test -f "$IPA"
          file "$IPA"
          ls -lh "$IPA"

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$RUNNER_TEMP/Toyako.ipa"

          /usr/bin/unzip -t "$IPA"
          /usr/bin/unzip -l "$IPA" | head -80

      - name: Publish IPA directly as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}-${{ github.run_number }}
          name: Toyako IPA ${{ github.run_number }}
          generate_release_notes: true
          files: ${{ runner.temp }}/Toyako.ipa
