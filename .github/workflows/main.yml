name: Build Toyako Unsigned IPA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show available Xcodes
        run: |
          ls -la /Applications | grep Xcode || true
          xcodebuild -version

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1)

          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26 was not found."
            exit 1
          fi

          echo "Using: $XCODE_PATH"

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Verify Generated Project
        run: |
          echo "Generated files:"
          ls -la

          echo "Xcode projects:"
          find . -maxdepth 2 -name "*.xcodeproj" -print

          echo "Available schemes:"
          xcodebuild -project Toyako.xcodeproj -list

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -project Toyako.xcodeproj \
            -scheme Toyako \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Toyako.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify Archive
        run: |
          echo "Archive contents:"
          find "$RUNNER_TEMP/Toyako.xcarchive" -maxdepth 5 -print

          if [ ! -d "$RUNNER_TEMP/Toyako.xcarchive/Products/Applications/Toyako.app" ]; then
            echo "Toyako.app was not found inside the archive."
            exit 1
          fi

          echo "Toyako.app found successfully."

      - name: Package into IPA
        run: |
          cd "$RUNNER_TEMP"

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "Toyako.xcarchive/Products/Applications/Toyako.app" \
            "Payload/Toyako.app"

          zip -r "Toyako.ipa" Payload

      - name: Verify IPA
        run: |
          ls -lh "$RUNNER_TEMP/Toyako.ipa"

          unzip -l "$RUNNER_TEMP/Toyako.ipa" | head -50

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Toyako-Unsigned-IPA
          path: ${{ runner.temp }}/Toyako.ipa
